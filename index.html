<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Envie arquivos CSV e veja estatísticas e gráficos no navegador.">
    <meta name="color-scheme" content="dark">
    <title>CSV Statistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./css/normalize.css">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="icon" href="./imgs/CSV.png" sizes="16x16" type="image/png">
</head>

<body>
    <h1 id="title_text"><a href="">📊 CSV Statistics</a></h1>

    <div id="upload_div">
        <p class="subtitle">Envie seus arquivos <strong>.csv</strong> e veja as estatísticas e gráficos — tudo no seu navegador.</p>
        <div class="droppable" id="drop_f">
            <span class="drop-icon" aria-hidden="true">⬆</span>
            <span class="drop-text">Arraste os arquivos aqui ou clique para escolher</span>
        </div>
        <button id="upload">Enviar</button>
    </div>

    <div id="div_stats"></div>

    <div id="loading">
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
    </div>
</body>

</footer>

<script src="./js/statiscs.js"></script>

</html>
